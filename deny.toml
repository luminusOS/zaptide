# CI runs `cargo deny check --warn unmaintained advisories bans sources`:
# cargo-deny has no warn level for unmaintained advisories in this file, and
# they should be reported without failing the build. Dependency licences
# need separate review; these checks do not establish licence compliance.

[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0372", reason = "Transitive dependency through glycin and zbus; no safe compatible upgrade is currently available. Revisit when upstream dependencies migrate to zbus 6." },
]

yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/oxidezap/whatsapp-rust"]
