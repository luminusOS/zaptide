title: ZapTide
description: A fast, lightweight WhatsApp app for Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Berlin
url: https://luminusos.github.io
baseurl: /zaptide
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - WhatsApp client
        - Rust
        - egui
        - whatsapp-rust
        - Linux WhatsApp desktop
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: ZapTide showing a chat with a photo, a voice message, a quoted reply, and a link preview
    publisher:
      type: Organization
      name: LuminusOS
      url: https://github.com/luminusOS
      same_as:
        - https://github.com/luminusOS/zaptide
  llms:
    title: ZapTide
    description: >-
      Documentation for ZapTide, a native WhatsApp client for chats, voice
      messages, attachments, and notifications on Linux, macOS, and Windows.
    full: true
    details: >-
      Covers installation, phone linking, everyday use, settings, and the
      WhatsApp connection. Source is on
      [GitHub](https://github.com/luminusOS/zaptide).
  branding:
    site_title: ZapTide
    logo:
      default: /assets/images/logo.svg
      alt: ZapTide
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      ZapTide is maintained by LuminusOS.
    copyright: >-
      Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. ZapTide is an independent project, not affiliated with or endorsed by WhatsApp LLC or Meta. WhatsApp is a trademark of WhatsApp LLC.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/luminusOS/zaptide/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: luminusOS/zaptide
    text: Star
    show_count: true
  github_sponsor:
    enabled: false

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
