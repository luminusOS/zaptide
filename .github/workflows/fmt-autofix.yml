name: Format autofix

# Runs `cargo fmt --all` on a pull request branch and pushes the result back
# if it changed anything, so a contributor never has to fix formatting by
# hand. The `fmt` job in ci.yml still runs `cargo fmt --all --check` as a
# hard gate, since a workflow triggered by a fork's pull_request only gets a
# read-only token and cannot push here.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fmt-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    # Skip PRs from forks: GITHUB_TOKEN is read-only for them, so the push
    # step below would just fail. Those PRs still get the `fmt --check` gate
    # in ci.yml and a contributor runs `cargo fmt --all` locally.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "style: cargo fmt"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
