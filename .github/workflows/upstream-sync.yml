name: Upstream Sync

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-deps:
    name: check-deps (no egui)
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Reject forbidden UI dependencies
        run: |
          chmod +x scripts/check-native-ui-deps.sh
          scripts/check-native-ui-deps.sh

  fmt:
    name: fmt
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libgstreamer1.0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-clippy
      - run: cargo clippy --locked --all-targets --features demo -- -D warnings

  clippy-all:
    name: clippy (all features)
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libgstreamer1.0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-clippy-all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libgstreamer1.0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-test
      - run: cargo test --locked --all-targets --features demo

  test-all:
    name: test (all features)
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libgstreamer1.0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-test-all
      - run: cargo test --locked --all-targets --all-features

  doc:
    name: doc
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libgstreamer1.0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-doc
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

  tree-dupes:
    name: tree-dupes
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libgstreamer1.0-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-tree-dupes
      - name: Check for duplicate GTK/GLib/libadwaita/Relm4 crates
        run: |
          OUTPUT=$(cargo tree -d 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE '(gtk|glib|libadwaita|relm|adw)'; then
            echo "ERROR: Duplicate GTK/GLib/libadwaita/Relm4 crates found in dependency tree"
            exit 1
          fi

  packaging-check:
    name: packaging-check
    if: contains(github.event.pull_request.labels.*.name, 'upstream-sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run packaging check
        run: |
          chmod +x packaging/check.sh
          ./packaging/check.sh
