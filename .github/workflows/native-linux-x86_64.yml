name: Native Linux x86_64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Native Linux archive (x86_64)
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45@sha256:f5afe36c8ddb2aa5333597e900f53c5ed0267d9ebb27be765dc8ec2633aa1648

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install GUI build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ git gtk4-devel libadwaita-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            cmake libseccomp-devel fontconfig-devel \
            perl make tar zstd

      - name: Build release binary
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package native Linux archive
        shell: bash
        run: |
          set -euo pipefail
          name="zaptide-${GITHUB_SHA:0:7}-x86_64-linux-gnu"
          mkdir -p "dist/$name"

          cp target/x86_64-unknown-linux-gnu/release/zaptide \
             README.md LICENSE "dist/$name/"

          cp --parents \
            data/dev.luminusos.ZapTide.desktop \
            data/icons/zaptide.svg \
            data/icons/zaptide-symbolic.svg \
            data/icons/zaptide-unread-symbolic.svg \
            "dist/$name/"

          cp -r po "dist/$name/"
          sh packaging/install-licenses.sh "dist/$name/licenses/zaptide"

          cd dist
          tar czf "$name.tar.gz" "$name"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zaptide-native-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
