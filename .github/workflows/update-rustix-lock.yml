name: Generate rustix lockfile update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update rustix in Cargo.lock
        run: cargo update -p rustix --precise 1.1.6

      - name: Verify generated lockfile
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          lock = Path("Cargo.lock").read_text()
          packages = re.findall(
              r'\[\[package\]\]\s*name = "rustix"\s*version = "([^"]+)"',
              lock,
          )
          if not packages:
              raise SystemExit("Cargo.lock contains no rustix package")
          bad = [version for version in packages if version != "1.1.6"]
          if bad:
              raise SystemExit(f"Unexpected rustix versions remain: {bad}")
          print("Verified rustix version(s):", ", ".join(packages))
          PY

      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: rustix-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
