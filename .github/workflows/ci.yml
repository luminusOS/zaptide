name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake libseccomp-devel fontconfig-devel perl make tar zstd
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: No duplicate GTK/GLib/libadwaita/Relm4 crates
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--format-version", "1"]
          ))
          packages = collections.defaultdict(set)
          for package in metadata["packages"]:
              name = package["name"]
              if any(name == root or name.startswith(root + "-") for root in (
                  "gtk4", "gdk4", "glib", "gio", "libadwaita", "relm4"
              )):
                  packages[name].add(package["id"])
          duplicates = {name: ids for name, ids in packages.items() if len(ids) > 1}
          for name, ids in sorted(duplicates.items()):
              print(f"Duplicate {name}: {', '.join(sorted(ids))}")
          if duplicates:
              raise SystemExit(1)
          PY
