name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate contribution configuration
        run: |
          python3 -m venv "$RUNNER_TEMP/repository-checks"
          "$RUNNER_TEMP/repository-checks/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/repository-checks/bin/python" .github/tests/test_repository.py
          "$RUNNER_TEMP/repository-checks/bin/python" packaging/test-licenses.py

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45@sha256:f5afe36c8ddb2aa5333597e900f53c5ed0267d9ebb27be765dc8ec2633aa1648
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-plugin-openh264 xorg-x11-server-Xvfb dbus-daemon python3 libXtst cmake libseccomp-devel fontconfig-devel perl make tar zstd
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
        env:
          ZAPTIDE_REQUIRE_GST: '1'
      - name: GIF playback lifecycle
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          G_DEBUG: fatal-criticals
        run: |
          cargo test --locked --lib --no-run
          timeout 60s xvfb-run -a cargo test --locked --lib inline_gifs_release_playback_when_unmapped -- --ignored --nocapture
      - name: Sidebar scroll regressions
        env:
          ZAPTIDE_TEST_PRIVATE_XVFB: '1'
          GDK_BACKEND: x11
          GSETTINGS_BACKEND: memory
          GSK_RENDERER: cairo
          GTK_A11Y: none
          G_DEBUG: fatal-criticals
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --list --ignored > "$RUNNER_TEMP/ignored-tests.log"
          sed -n 's/: test$//p' "$RUNNER_TEMP/ignored-tests.log" > "$RUNNER_TEMP/ignored-test-names.log"
          sidebar=application::sidebar_coordinates::tests::
          chats=application::chats::account_selection_tests::
          grep -F "${sidebar}" "$RUNNER_TEMP/ignored-test-names.log" > "$RUNNER_TEMP/sidebar-tests.log"
          grep -F "${chats}" "$RUNNER_TEMP/ignored-test-names.log" >> "$RUNNER_TEMP/sidebar-tests.log"
          grep -F 'application::sidebar_runtime_tests::' "$RUNNER_TEMP/ignored-test-names.log" >> "$RUNNER_TEMP/sidebar-tests.log"
          for name in \
            reordered_chat_rows_keep_visible_anchor \
            removed_anchor_uses_visible_survivor \
            unchanged_update_keeps_pending_restore \
            chained_removal_falls_back_before_first_snapshot \
            proxy_input_before_and_after_commit_is_preserved \
            missing_materialized_target_falls_back_before_snapshot \
            missing_geometry_does_not_force_top \
            existing_unmaterialized_anchor_is_retried; do
            grep -Fx "${chats}${name}" "$RUNNER_TEMP/ignored-test-names.log" > /dev/null
          done
          for name in \
            backend_reorder_preserves_the_first_snapshot_and_open_chat \
            native_wheel_and_keyboard_survive_backend_reorder \
            logout_and_account_switch_cancel_pending_restore; do
            grep -Fx "application::sidebar_runtime_tests::${name}" "$RUNNER_TEMP/ignored-test-names.log" > /dev/null
          done
          while IFS= read -r test; do
            timeout 60s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' cargo test --locked --lib "$test" -- --ignored --exact --nocapture | tee "$RUNNER_TEMP/sidebar-test-output.log"
            grep -F 'test result: ok. 1 passed;' "$RUNNER_TEMP/sidebar-test-output.log"
          done < "$RUNNER_TEMP/sidebar-tests.log"
      - name: Transcript scroll bounds
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          G_DEBUG: fatal-criticals
        shell: bash
        run: |
          set -o pipefail
          timeout 60s xvfb-run -a cargo test --locked --lib application::transcript_view::tests::jump_button_tracks_transcript_growth_without_scrolling -- --exact --ignored --test-threads=1 | tee "$RUNNER_TEMP/transcript-scroll-test.log"
          grep -F 'test result: ok. 1 passed;' "$RUNNER_TEMP/transcript-scroll-test.log"
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: No duplicate GTK/GLib/libadwaita/Relm4 crates
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--format-version", "1"]
          ))
          packages = collections.defaultdict(set)
          for package in metadata["packages"]:
              name = package["name"]
              if any(name == root or name.startswith(root + "-") for root in (
                  "gtk4", "gdk4", "glib", "gio", "libadwaita", "relm4"
              )):
                  packages[name].add(package["id"])
          duplicates = {name: ids for name, ids in packages.items() if len(ids) > 1}
          for name, ids in sorted(duplicates.items()):
              print(f"Duplicate {name}: {', '.join(sorted(ids))}")
          if duplicates:
              raise SystemExit(1)
          PY
