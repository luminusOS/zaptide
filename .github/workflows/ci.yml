name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-deps:
    name: check-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Reject forbidden UI dependencies
        run: |
          chmod +x scripts/check-native-ui-deps.sh
          scripts/check-native-ui-deps.sh

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake gettext tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --locked --all-targets --features demo -- -D warnings

  clippy-all:
    name: clippy (all features)
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake gettext tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake gettext tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --locked --all-targets --features demo

  test-all:
    name: test (all features)
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake gettext tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-all
      - run: cargo test --locked --all-targets --all-features

  doc:
    name: doc
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake gettext tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

  tree-dupes:
    name: tree-dupes
    runs-on: ubuntu-24.04
    # libadwaita 1.10 (GNOME 51); Ubuntu does not package it yet.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake gettext tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: tree-dupes
      - name: Check for duplicate GTK/GLib/libadwaita/Relm4 crates
        run: |
          OUTPUT=$(cargo tree -d 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE '(gtk|glib|libadwaita|relm|adw)'; then
            echo "ERROR: Duplicate GTK/GLib/libadwaita/Relm4 crates found in dependency tree"
            exit 1
          fi

  packaging-check:
    name: packaging-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run packaging check
        run: |
          chmod +x packaging/check.sh
          ./packaging/check.sh
