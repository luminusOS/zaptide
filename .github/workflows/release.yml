name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match tag, manifest and lockfile
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"]
          assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.?[1-9][0-9]*)?", tag), f"Invalid release tag: {tag}"
          version = tag[1:].split("-", 1)[0]
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          assert manifest["package"]["version"] == version, "Tag does not match Cargo.toml"
          assert any(p["name"] == "zaptide" and p["version"] == version for p in lock["package"]), "Cargo.lock does not match"
          import xml.etree.ElementTree as ET
          metainfo = ET.parse("packaging/flatpak/dev.luminusos.ZapTide.metainfo.xml").getroot()
          newest = metainfo.find("releases/release")
          assert newest is not None and newest.get("version") == version, "Newest metainfo release does not match"
          PY

  build:
    name: Linux executable (x86_64)
    needs: version
    runs-on: ubuntu-24.04
    # Use Fedora because this project needs a newer libadwaita than Ubuntu 24.04 provides.
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:f5afe36c8ddb2aa5333597e900f53c5ed0267d9ebb27be765dc8ec2633aa1648
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Add build target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: GUI build dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel cmake libseccomp-devel fontconfig-devel perl make
      - name: Build executable
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Upload the executable as the only artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zaptide-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/zaptide
          if-no-files-found: error
          retention-days: 7
