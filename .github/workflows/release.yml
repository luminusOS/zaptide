name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  ZAPTIDE_GIPHY_KEY: ${{ secrets.ZAPTIDE_GIPHY_KEY }}

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Match tag, manifest and lockfile
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"]
          assert re.fullmatch(r"v\d+\.\d+\.\d+(?:-rc\d+)?", tag), f"Invalid release tag: {tag}"
          version = tag[1:].split("-", 1)[0]
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          assert manifest["package"]["version"] == version, "Tag does not match Cargo.toml"
          assert any(p["name"] == "zaptide" and p["version"] == version for p in lock["package"]), "Cargo.lock does not match"
          PY

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Linux archive (${{ matrix.arch }})
    needs: ci
    runs-on: ${{ matrix.os }}
    # Linux builds need libadwaita 1.10 (GNOME 51), which Ubuntu does not
    # package yet.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: registry.fedoraproject.org/fedora:45
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            container: registry.fedoraproject.org/fedora:45
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git gtk4-devel libadwaita-devel alsa-lib-devel gstreamer1-devel cmake libseccomp-devel fontconfig-devel perl make tar zstd
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="zaptide-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zaptide" README.md LICENSE "dist/$name/"
          # Desktop integration for package builds and hand-installs.
          cp --parents packaging/applications/dev.luminusos.ZapTide.desktop packaging/icons/zaptide.svg packaging/icons/zaptide-symbolic.svg "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle: the same binary, in the
  # sandbox packaging/flatpak describes, so nothing compiles twice. Flathub
  # builds from source on its own machines, from the manifest beside it.
  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-archive
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf "dist/zaptide-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu.tar.gz" -C packaging/flatpak
          mv "packaging/flatpak/zaptide-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu" packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/dev.luminusos.ZapTide.bundle.yml
          bundle: zaptide-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: "*.flatpak"
          if-no-files-found: error

  appimage:
    name: AppImage bundle
    needs: ci
    uses: ./.github/workflows/release-appimage.yml

  publish:
    name: GitHub release
    needs: [build, flatpak, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            test -s "dist/zaptide-${GITHUB_REF_NAME}-${arch}.flatpak"
            test -s "dist/zaptide-${GITHUB_REF_NAME}-${arch}.AppImage"
            test -s "dist/zaptide-${GITHUB_REF_NAME}-${arch}-linux-gnu.tar.gz"
          done
      - name: Checksums
        working-directory: dist
        run: sha256sum *.flatpak *.AppImage *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.flatpak
            dist/*.AppImage
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
