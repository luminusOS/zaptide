name: Dependencies

on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, deny.toml, .github/workflows/deny.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, deny.toml, .github/workflows/deny.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Update yanked dependency
        run: cargo update -p async-executor

      - name: Commit updated Cargo.lock
        if: github.event_name != 'pull_request'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Update yanked async-executor dependency"
            git push origin "HEAD:$BRANCH"
          else
            echo "Cargo.lock is already up to date."
          fi

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: --warn unmaintained advisories bans sources
