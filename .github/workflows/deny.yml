name: Dependencies

on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, deny.toml, .github/workflows/deny.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, deny.toml, .github/workflows/deny.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: --warn unmaintained advisories bans sources
