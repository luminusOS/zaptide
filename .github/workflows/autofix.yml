name: Automatic Fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autofix-main
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:f5afe36c8ddb2aa5333597e900f53c5ed0267d9ebb27be765dc8ec2633aa1648

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ git gtk4-devel libadwaita-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            gstreamer1-plugins-base gstreamer1-plugins-good \
            gstreamer1-plugins-bad-free gstreamer1-plugin-openh264 \
            cmake libseccomp-devel fontconfig-devel perl make

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy

      - name: Verify repository checkout
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Update dependencies
        working-directory: ${{ github.workspace }}
        run: cargo update -p async-executor

      - name: Format Rust code
        working-directory: ${{ github.workspace }}
        run: cargo fmt --all

      - name: Apply Clippy fixes
        working-directory: ${{ github.workspace }}
        run: cargo clippy --fix --allow-dirty --allow-staged --all-targets

      - name: Commit and push fixes
        run: |
          REPO="$GITHUB_WORKSPACE"

          git -C "$REPO" config user.name "github-actions[bot]"
          git -C "$REPO" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$REPO" add -A

          if ! git -C "$REPO" diff --cached --quiet; then
            git -C "$REPO" commit -m "Apply automatic Rust fixes"
            git -C "$REPO" push origin HEAD:main
          else
            echo "No automatic fixes were necessary."
          fi
