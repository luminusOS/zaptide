# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as dev.luminusos.ZapTide.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: dev.luminusos.ZapTide
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: zaptide
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --persist=.local/state
modules:
  - name: zaptide
    buildsystem: simple
    build-commands:
      - install -Dm755 zaptide /app/bin/zaptide
      - install -Dm644 packaging/applications/dev.luminusos.ZapTide.desktop /app/share/applications/dev.luminusos.ZapTide.desktop
      - sed -i 's/^Icon=zaptide$/Icon=dev.luminusos.ZapTide/' /app/share/applications/dev.luminusos.ZapTide.desktop
      - install -Dm644 packaging/icons/zaptide.svg /app/share/icons/hicolor/scalable/apps/dev.luminusos.ZapTide.svg
      - install -Dm644 packaging/flatpak/dev.luminusos.ZapTide.metainfo.xml /app/share/metainfo/dev.luminusos.ZapTide.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/zaptide/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: dev.luminusos.ZapTide.metainfo.xml
        dest: packaging/flatpak
