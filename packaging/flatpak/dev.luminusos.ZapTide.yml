# ZapTide as a Flatpak, built from source: the manifest Flathub builds
# from. The copy in the Flathub repository names a tag and its commit in
# the source below and carries cargo-sources.json next to it; flathub.sh
# writes both. For a local build, this one takes the checkout as it is:
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/dev.luminusos.ZapTide.yml
#
# The release workflow does not build from source twice: it packages the
# binary the Linux job already built, through the bundle manifest beside
# this one, whose finish-args are the same as these.
id: dev.luminusos.ZapTide
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zaptide
finish-args:
  # Wayland first, X11 when that is what there is.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound: PulseAudio, which PipeWire also answers.
  - --socket=pulseaudio
  # WhatsApp and attachment downloads.
  - --share=network
  # Archive key.
  - --talk-name=org.freedesktop.secrets
  # Tray icon, shown by KDE or GNOME's AppIndicator extension.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Older Flatpak versions leave XDG_STATE_HOME unset. Keep the fallback
  # state directory (session, history, logs, and credential markers) durable.
  - --persist=.local/state
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/zaptide/cargo
modules:
  - name: zaptide
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/zaptide /app/bin/zaptide
      - install -Dm644 packaging/applications/dev.luminusos.ZapTide.desktop /app/share/applications/dev.luminusos.ZapTide.desktop
      - sed -i 's/^Icon=zaptide$/Icon=dev.luminusos.ZapTide/' /app/share/applications/dev.luminusos.ZapTide.desktop
      - install -Dm644 packaging/icons/zaptide.svg /app/share/icons/hicolor/scalable/apps/dev.luminusos.ZapTide.svg
      - install -Dm644 packaging/icons/zaptide-symbolic.svg /app/share/icons/hicolor/symbolic/apps/dev.luminusos.ZapTide-symbolic.svg
      - install -Dm644 packaging/flatpak/dev.luminusos.ZapTide.metainfo.xml /app/share/metainfo/dev.luminusos.ZapTide.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/zaptide/LICENSE
    sources:
      - type: dir
        path: ../..
      # Supply the current app ID even when generating a manifest for an older tag.
      - type: file
        path: dev.luminusos.ZapTide.metainfo.xml
        dest: packaging/flatpak
      # Every crate the lockfile names, for the offline build; flathub.sh
      # writes it with flatpak-cargo-generator.
      - cargo-sources.json
