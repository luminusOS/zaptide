# Shared CLI: gem install native-packages --version 0.6.0
---
schema: 1
tool:
  version: 0.6.0
  nfpm: 2.47.0
libraries:
  libgstreamer-1.0.so.0:
    rpm: gstreamer1
  libasound.so.2:
    rpm: alsa-lib
nfpm:
  name: zaptide
  maintainer: LuminusOS
  homepage: https://github.com/luminusOS/zaptide
  description: Fast native WhatsApp client
  license: MIT
  contents:
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/zaptide"
    dst: "/usr/bin/zaptide"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zaptide/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zaptide/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/packaging/applications/dev.luminusos.ZapTide.desktop"
    dst: "/usr/share/applications/dev.luminusos.ZapTide.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/packaging/icons/zaptide.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zaptide.svg"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/packaging/icons/zaptide-symbolic.svg"
    dst: "/usr/share/icons/hicolor/symbolic/apps/zaptide-symbolic.svg"
    file_info:
      mode: 420
  overrides:
    rpm:
      depends:
      - glibc >= 2.39
      - gtk4
      - libadwaita >= 1.10
      # Photos load through glycin's sandboxed loaders.
      - glycin-loaders
      - bubblewrap
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - rpm
    input:
      local: dist/zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - rpm
    input:
      local: dist/zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: luminusOS/zaptide
  checksums: checksums.txt
assets:
  AMD64:
    file: zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: zaptide-@VERSION@.tar.gz
    url: https://github.com/luminusOS/zaptide/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zaptide-@VERSION@.tar.gz
version_file: Cargo.toml
