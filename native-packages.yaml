# Shared CLI: gem install native-packages --version 0.6.0
---
schema: 1
tool:
  version: 0.6.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use ALSA's t64 package name.
libraries:
  libgstreamer-1.0.so.0:
    deb: libgstreamer1.0-0
    rpm: gstreamer1
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: zaptide
  maintainer: LuminusOS
  homepage: https://github.com/luminusOS/zaptide
  description: Fast native WhatsApp client
  license: MIT
  contents:
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/zaptide"
    dst: "/usr/bin/zaptide"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zaptide/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zaptide/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/packaging/applications/dev.luminusos.ZapTide.desktop"
    dst: "/usr/share/applications/dev.luminusos.ZapTide.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/packaging/icons/zaptide.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zaptide.svg"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zaptide-v@VERSION@-@TARGET@/packaging/icons/zaptide-symbolic.svg"
    dst: "/usr/share/icons/hicolor/symbolic/apps/zaptide-symbolic.svg"
    file_info:
      mode: 420
  overrides:
    deb:
      depends:
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libasound2-plugins
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - glibc >= 2.39
      - gtk4
      - libadwaita >= 1.10
      # Photos load through glycin's sandboxed loaders.
      - glycin-loaders
      - bubblewrap
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'zaptide-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: luminusOS/zaptide
  checksums: checksums.txt
assets:
  AMD64:
    file: zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zaptide-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zaptide-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: zaptide-v@VERSION@-macos-universal.dmg
    local: dist/zaptide-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: zaptide-@VERSION@.tar.gz
    url: https://github.com/luminusOS/zaptide/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zaptide-@VERSION@.tar.gz
templates:
  homebrew/zaptide.rb: packaging/homebrew/zaptide.rb.in
  arch/zaptide/PKGBUILD: packaging/arch/zaptide/PKGBUILD.in
  arch/zaptide/zaptide.install: packaging/arch/zaptide.install
  arch/zaptide-bin/PKGBUILD: packaging/arch/zaptide-bin/PKGBUILD.in
  arch/zaptide-bin/zaptide-bin.install: packaging/arch/zaptide.install
  arch/zaptide-git/PKGBUILD: packaging/arch/zaptide-git/PKGBUILD.in
  arch/zaptide-git/zaptide-git.install: packaging/arch/zaptide.install
repositories:
  homebrew:
    url: https://github.com/luminusOS/homebrew-tap.git
    push_url: https://github.com/luminusOS/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/zaptide.rb: Casks/zaptide.rb
    version_file: Casks/zaptide.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/zaptide.git
    push_url: ssh://aur@aur.archlinux.org/zaptide.git
    branch: master
    package_path: "."
    files:
      arch/zaptide: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/zaptide-bin.git
    push_url: ssh://aur@aur.archlinux.org/zaptide-bin.git
    branch: master
    package_path: "."
    files:
      arch/zaptide-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/zaptide-git.git
    push_url: ssh://aur@aur.archlinux.org/zaptide-git.git
    branch: master
    package_path: "."
    files:
      arch/zaptide-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
