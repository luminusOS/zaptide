[package]
name = "zaptide"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
description = "A Linux-first native WhatsApp client built with Rust, GTK4, libadwaita, and Relm4"
homepage = "https://github.com/luminusOS/zaptide"
repository = "https://github.com/luminusOS/zaptide"
keywords = ["whatsapp", "chat", "gtk", "messaging"]
categories = ["gui"]

[package.metadata.appimage]
icon = "data/icons/zaptide.svg"
desktop_entry = "data/dev.luminusos.ZapTide.desktop"
auto_link = true
auto_link_exclude_list = [
  "ld-linux*.so*",
  "libanl.so*",
  "libBrokenLocale.so*",
  "libc.so*",
  "libdl.so*",
  "libgcc_s.so*",
  "libm.so*",
  "libmvec.so*",
  "libnsl.so*",
  "libnss_*.so*",
  "libpthread.so*",
  "libresolv.so*",
  "librt.so*",
  "libstdc++.so*",
  "libutil.so*",
]

[features]
# Offline demo data and window captures for the website; never part of a release.
demo = []

[lib]
name = "zaptide"
path = "src/lib.rs"

[[bin]]
name = "zaptide"
path = "src/main.rs"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
anyhow = "1"
hex = "0.4"
sha2 = "0.11"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
directories = "6"
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_10"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_46"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rasterlottie = { version = "0.3", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# WhatsApp Web protocol: pairing, encryption, history sync, and media. Version
# 0.7.0 on crates.io enables `simd`, which needs nightly Rust. This commit builds
# on stable and includes snapshot recovery and no-progress conflict handling
# (upstream #1365, #1374 and #1375). Selected features provide Tokio transport, ureq media downloads,
# and the SQLite device store. The window handles shutdown instead of `signal`.
# Includes upstream Business pairing (#1440), LockChatUpdate and snapshot replay
# (#1507). Device-store compatibility retains the legacy created_at column.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "ae3cefd86065872a577bbd0ad5ee21b60c86c616", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "voip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
# SQLCipher encrypts the archive; the device store shares the same library.
# Bundle OpenSSL so all release platforms use the same encryption provider.
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
# Keys the device store's pooled connections. Already included through whatsapp-rust.
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
getrandom = "0.4"
# Keyring: the Secret portal's file keyring inside a sandbox, the Secret
# Service outside. OpenSSL is the one SQLCipher already links, so no second
# crypto stack comes with it.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "openssl_crypto"] }
zeroize = "1"
qrcode = { version = "0.14", default-features = false }
# Downloads profile pictures. The protocol library already includes this crate
# and TLS stack.
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
url-batch = { package = "url", path = "vendor/absolute-url", features = ["batch-research"] }
idna-batch = { package = "idna", path = "vendor/idna-1.1.0", features = ["research-batch"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["experimental_linear_ccc"] }
jiff = "0.2"
mime_guess = "2"
# Promotes downloads with renameat2(RENAME_NOREPLACE). Already in the tree
# through tempfile, polling and async-io.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

opus = "0.4"
ogg = "0.9"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
async-channel = "2"
# Loads photos through GNOME's sandboxed image loaders (glycin-loaders).
glycin = { version = "4", default-features = false, features = ["gdk4", "tokio"] }
# XDG desktop portals over the zbus and tokio already in the tree. Only the
# portals the app uses are enabled; no windowing or PipeWire bindings.
ashpd = { version = "0.14", default-features = false, features = ["tokio", "background", "camera", "notification", "settings"] }
futures-util = { version = "0.3", default-features = false }
# Tray icon: StatusNotifierItem with its menu over com.canonical.dbusmenu.
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# Sealed memory files, the only kind of descriptor the notification portal accepts.
# Already in the tree through gio.
libc = "0.2"

[dev-dependencies]
url-batch = { package = "url", path = "vendor/absolute-url", features = ["batch-research", "batch-stats"] }
png = "0.18"

[patch.crates-io]
icu_normalizer = { path = "vendor/icu_normalizer" }
diesel = { path = "vendor/diesel-2.3.14" }
libsqlite3-sys = { path = "vendor/libsqlite3-sys-0.39.1" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Backtraces keep file and line numbers at about half the size of full debug
# info. Set `CARGO_PROFILE_DEV_DEBUG=true` when a debugger needs variables.
[profile.dev]
debug = "line-tables-only"

# Optimize dependencies in development for usable decryption and UI layout.
# Keep the application crate incremental.
[profile.dev.package."*"]
opt-level = 2
