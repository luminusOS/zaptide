[package]
name = "zaptide"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A Linux-first native WhatsApp client built with Rust, GTK4, libadwaita, and Relm4"
homepage = "https://github.com/luminusOS/zaptide"
repository = "https://github.com/luminusOS/zaptide"
keywords = ["whatsapp", "chat", "gtk", "messaging"]
categories = ["gui"]

[package.metadata.appimage]
icon = "packaging/icons/zaptide.svg"
desktop_entry = "packaging/applications/dev.luminusos.ZapTide.desktop"
auto_link = true
auto_link_exclude_list = [
  "ld-linux*.so*",
  "libanl.so*",
  "libBrokenLocale.so*",
  "libc.so*",
  "libdl.so*",
  "libgcc_s.so*",
  "libm.so*",
  "libmvec.so*",
  "libnsl.so*",
  "libnss_*.so*",
  "libpthread.so*",
  "libresolv.so*",
  "librt.so*",
  "libstdc++.so*",
  "libutil.so*",
]

[lib]
name = "zaptide"
path = "src/lib.rs"

[[bin]]
name = "zaptide"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Hashes saved stickers by content. Already included through wacore.
sha2 = "0.11"
# Already in the tree through rustls; used for the locked-chat code verifier.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
directories = "6"
# Native GTK4/libadwaita/Relm4 stack.
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_10"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_46"] }
# Decodes JPEG, PNG, WebP, and GIF images.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# WhatsApp Web protocol: pairing, encryption, history sync, and media. Version
# 0.7.0 on crates.io enables `simd`, which needs nightly Rust. This commit builds
# on stable and includes snapshot recovery and no-progress conflict handling
# (upstream #1365, #1374 and #1375). Selected features provide Tokio transport, ureq media downloads,
# and the SQLite device store. The window handles shutdown instead of `signal`.
# Includes upstream Business pairing (#1440), LockChatUpdate and snapshot replay
# (#1507). Device-store compatibility retains the legacy created_at column.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "ae3cefd86065872a577bbd0ad5ee21b60c86c616", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
# SQLCipher encrypts the archive; the device store shares the same library.
# Bundle OpenSSL so all release platforms use the same encryption provider.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring-core = "1"
getrandom = "0.4"
zeroize = "1"
rand = "0.10"
qrcode = { version = "0.14", default-features = false }
# Downloads profile pictures. The protocol library already includes this crate
# and TLS stack.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Parses link-preview URLs.
url = "2"
jiff = "0.2"
# MIME detection for attachments.
mime_guess2 = "2"

rodio = { version = "0.22", default-features = false, features = ["playback", "recording", "mp3", "mp4", "wav", "vorbis"] }
opus = "0.4"
ogg = "0.9"
gstreamer = "0.25"
# Loads photos through GNOME's sandboxed image loaders (glycin-loaders).
glycin = { version = "4", default-features = false, features = ["gdk4", "tokio"] }
notify = "8.2"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
# Tray icon: StatusNotifierItem with its menu over com.canonical.dbusmenu.
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }

[dev-dependencies]
tempfile = "3"
# Encodes oversized clipboard images in portal tests. Already included through image.
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Optimize dependencies in development for usable decryption and UI layout.
# Keep the application crate incremental.
[profile.dev.package."*"]
opt-level = 2
